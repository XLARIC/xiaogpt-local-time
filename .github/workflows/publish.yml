name: Build and publish on SG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sg-xiaogpt-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.SG_PUBLISH_ENABLED == 'true' &&
      github.actor == github.repository_owner &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, Linux, X64, aliyun-sg-t5]
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify SG and publishing configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-xiaogpt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          docker version
          docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          mkdir -m 700 -p "$DOCKER_CONFIG"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build on SG
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/xiaogpt-local-time"
          tag="$image:sha-${GITHUB_SHA:0:12}"
          version="$(cat VERSION)"
          docker build --platform linux/amd64 --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" --tag "$tag" .
          printf 'IMAGE=%s\nIMAGE_TAG=%s\n' "$image" "$tag" >> "$GITHUB_ENV"
      - name: Test the built image without network access
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none --workdir /tests \
            -v "$GITHUB_WORKSPACE:/tests:ro" --entrypoint /app/.venv/bin/python \
            "$IMAGE_TAG" -m unittest discover -s tests -p 'test_local_time.py' -v
          docker run --rm --platform linux/amd64 --network none -e TZ=Pacific/Auckland \
            -v "$GITHUB_WORKSPACE:/tests:ro" --entrypoint /app/.venv/bin/python \
            "$IMAGE_TAG" /tests/tests/test_image.py
          docker run --rm --platform linux/amd64 --network none -e TZ=Asia/Shanghai "$IMAGE_TAG" --help
      - name: Publish image tags
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$version" = "$(cat VERSION)"
            docker tag "$IMAGE_TAG" "$IMAGE:$version"
            docker push "$IMAGE:$version"
          fi
          docker tag "$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          printf '### SG build published\n\nRunner: %s\n\nCommit: %s\n\nImage: %s\n' \
            "$RUNNER_NAME" "$GITHUB_SHA" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear temporary registry login
        if: always()
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/docker-xiaogpt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export DOCKER_CONFIG
          if test -d "$DOCKER_CONFIG"; then
            docker logout >/dev/null 2>&1 || true
            rm -f "$DOCKER_CONFIG/config.json"
            rmdir "$DOCKER_CONFIG" || true
          fi
